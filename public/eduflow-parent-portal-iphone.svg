<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200" role="img" aria-labelledby="title desc">
  <title id="title">EduFlow Parents Portal iPhone mockup</title>
  <desc id="desc">A premium black iPhone displaying the EduFlow Parents Portal with attendance, homework, fees and AI companion cards.</desc>
  <defs>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111827"/><stop offset=".5" stop-color="#020617"/><stop offset="1" stop-color="#1f2937"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%"><feDropShadow dx="0" dy="30" stdDeviation="28" flood-color="#0f172a" flood-opacity=".28"/></filter>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity=".07"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="85" y="20" width="630" height="1160" rx="92" fill="url(#phone)"/>
    <rect x="101" y="36" width="598" height="1128" rx="78" fill="#050b16" stroke="#334155" stroke-width="3"/>
    <rect x="125" y="60" width="550" height="1080" rx="64" fill="url(#screen)"/>
    <rect x="295" y="76" width="210" height="48" rx="24" fill="#020617"/>
    <circle cx="460" cy="100" r="7" fill="#172033"/>
    <rect x="153" y="78" width="56" height="18" rx="9" fill="#e2e8f0" opacity=".7"/>
    <text x="163" y="91" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#475569">9:41</text>
    <text x="613" y="91" text-anchor="end" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#475569">5G  •  ●</text>

    <g font-family="Arial, sans-serif">
      <text x="157" y="164" font-size="18" font-weight="800" fill="#0f172a">EduFlow</text>
      <circle cx="238" cy="157" r="5" fill="#22c55e"/>
      <text x="252" y="164" font-size="11" font-weight="700" fill="#64748b">Parents Portal</text>
      <text x="645" y="164" text-anchor="end" font-size="11" font-weight="700" fill="#94a3b8">Ahmed's family</text>
      <line x1="157" y1="181" x2="643" y2="181" stroke="#e2e8f0"/>

      <text x="157" y="218" font-size="13" fill="#64748b">Good morning,</text>
      <text x="157" y="247" font-size="26" font-weight="800" fill="#0f172a">Stay connected.</text>
      <text x="157" y="274" font-size="26" font-weight="800" fill="#2563eb">Support their journey.</text>

      <rect x="157" y="299" width="486" height="122" rx="24" fill="url(#blue)"/>
      <circle cx="211" cy="360" r="31" fill="#fff" opacity=".18"/>
      <circle cx="211" cy="350" r="12" fill="#fff" opacity=".95"/>
      <path d="M188 382c5-18 41-18 46 0" fill="#fff" opacity=".95"/>
      <text x="258" y="340" font-size="11" font-weight="700" fill="#dbeafe">STUDENT</text>
      <text x="258" y="367" font-size="21" font-weight="800" fill="#fff">Ayesha Ahmed</text>
      <text x="258" y="392" font-size="12" font-weight="600" fill="#bfdbfe">Grade 8  •  Roll No. 24</text>
      <text x="612" y="344" text-anchor="end" font-size="11" font-weight="700" fill="#dbeafe">ATTENDANCE</text>
      <text x="612" y="376" text-anchor="end" font-size="26" font-weight="800" fill="#fff">96%</text>

      <text x="157" y="455" font-size="15" font-weight="800" fill="#0f172a">Today at school</text>
      <rect x="157" y="473" width="232" height="126" rx="20" fill="#fff" stroke="#e2e8f0" filter="url(#card)"/>
      <circle cx="184" cy="502" r="16" fill="#dbeafe"/><text x="184" y="507" text-anchor="middle" font-size="14" font-weight="800" fill="#2563eb">M</text>
      <text x="211" y="503" font-size="10" font-weight="700" fill="#94a3b8">UPCOMING</text>
      <text x="176" y="538" font-size="14" font-weight="800" fill="#0f172a">Maths Unit Test</text>
      <text x="176" y="560" font-size="11" fill="#64748b">28 Apr  •  Algebra</text>
      <rect x="176" y="575" width="83" height="14" rx="7" fill="#eff6ff"/><text x="217" y="585" text-anchor="middle" font-size="8" font-weight="800" fill="#2563eb">TOMORROW</text>

      <rect x="411" y="473" width="232" height="126" rx="20" fill="#fff" stroke="#e2e8f0" filter="url(#card)"/>
      <circle cx="438" cy="502" r="16" fill="#dcfce7"/><text x="438" y="507" text-anchor="middle" font-size="14" font-weight="800" fill="#16a34a">✓</text>
      <text x="465" y="503" font-size="10" font-weight="700" fill="#94a3b8">FEES</text>
      <text x="430" y="538" font-size="14" font-weight="800" fill="#0f172a">Paid</text>
      <text x="430" y="560" font-size="11" fill="#64748b">PKR 25,000</text>
      <text x="430" y="584" font-size="10" font-weight="700" fill="#16a34a">Next due: 15 May</text>

      <text x="157" y="638" font-size="15" font-weight="800" fill="#0f172a">Homework</text>
      <rect x="157" y="656" width="486" height="78" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect x="176" y="675" width="36" height="36" rx="11" fill="#ede9fe"/><text x="194" y="699" text-anchor="middle" font-size="17" font-weight="800" fill="#7c3aed">S</text>
      <text x="228" y="682" font-size="12" font-weight="800" fill="#0f172a">Science — Chapter 4</text>
      <text x="228" y="703" font-size="10" fill="#64748b">2 tasks assigned  •  Due today</text>
      <circle cx="610" cy="694" r="14" fill="#dcfce7"/><text x="610" y="699" text-anchor="middle" font-size="12" font-weight="800" fill="#16a34a">2</text>

      <rect x="157" y="758" width="486" height="126" rx="22" fill="#eff6ff" stroke="#bfdbfe"/>
      <circle cx="195" cy="797" r="20" fill="#2563eb"/><text x="195" y="803" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">AI</text>
      <text x="229" y="791" font-size="13" font-weight="800" fill="#1e3a8a">EduFlow AI Companion</text>
      <text x="229" y="813" font-size="10" fill="#475569">Ask about attendance, homework, fees or results.</text>
      <rect x="176" y="838" width="444" height="29" rx="14" fill="#fff" stroke="#bfdbfe"/>
      <text x="193" y="857" font-size="10" fill="#94a3b8">Ask EduFlow AI…</text>
      <text x="602" y="857" text-anchor="end" font-size="12" font-weight="800" fill="#2563eb">→</text>

      <rect x="157" y="906" width="486" height="76" rx="20" fill="#fff" stroke="#e2e8f0"/>
      <circle cx="193" cy="944" r="17" fill="#fef3c7"/><text x="193" y="950" text-anchor="middle" font-size="14" fill="#d97706">!</text>
      <text x="222" y="937" font-size="11" font-weight="800" fill="#0f172a">School update</text>
      <text x="222" y="957" font-size="10" fill="#64748b">Parent-teacher meeting on Friday at 3:30 PM.</text>

      <line x1="157" y1="1010" x2="643" y2="1010" stroke="#e2e8f0"/>
      <text x="185" y="1052" text-anchor="middle" font-size="10" font-weight="800" fill="#2563eb">⌂</text>
      <text x="185" y="1070" text-anchor="middle" font-size="8" font-weight="700" fill="#2563eb">Home</text>
      <text x="310" y="1052" text-anchor="middle" font-size="10" font-weight="700" fill="#64748b">▦</text>
      <text x="310" y="1070" text-anchor="middle" font-size="8" font-weight="700" fill="#64748b">Academics</text>
      <text x="490" y="1052" text-anchor="middle" font-size="10" font-weight="700" fill="#64748b">₹</text>
      <text x="490" y="1070" text-anchor="middle" font-size="8" font-weight="700" fill="#64748b">Fees</text>
      <text x="615" y="1052" text-anchor="middle" font-size="10" font-weight="700" fill="#64748b">●</text>
      <text x="615" y="1070" text-anchor="middle" font-size="8" font-weight="700" fill="#64748b">Profile</text>
    </g>
  </g>
</svg>
